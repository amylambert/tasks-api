name: Secret Demo
on: workflow_dispatch
jobs:
  secret-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}

    steps:
      - run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "secret absent"; exit 1
          fi
          echo "longueur : ${#DEMO_TOKEN}"
          echo "$DEMO_TOKEN"
          echo "${{ vars.APP_ENV}}"
