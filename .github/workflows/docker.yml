name: Docker
on: 
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    # 1. Expose the step output as a job-level output
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      
      - uses: docker/setup-buildx-action@v4
      
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha, format=short
            type=semver, pattern={{version}}

      - name: Version de l'application
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.release_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    
    permissions:
      packages: read
    
    steps:
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_ENV"
      
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image du commit
        run: docker run -d --name api -p 8000:8000 "$IMAGE:sha-${GITHUB_SHA::7}"
      
      - name: Test de fumée
        run: |
          for i in $(seq 1 10); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/version

  deploy-production:
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    environment: production
    permissions:
      packages: read
    
    steps:
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_ENV"
      
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image de la release
        env:
          VERSION: ${{ needs.build.outputs.release_tag }}
        run: docker run -d --name api -p 8000:8000 "$IMAGE:$VERSION"

      - name: Test de fumée
        run: |
          for i in $(seq 1 10); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/version